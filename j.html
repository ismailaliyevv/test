<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Müsahibə Sualları və Cavablar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --card: #1e2235;
    --border: #2a2f45;
    --accent: #4f8ef7;
    --accent2: #a78bfa;
    --green: #34d399;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --dim: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  header p {
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .ctrl-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.8rem;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .ctrl-btn:hover { background: var(--border); border-color: var(--accent); color: var(--accent); }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .speed-select {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.8rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }

  .progress-bar { height: 3px; background: var(--border); }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
    width: 0%;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px 100px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  .card:hover { border-color: #3a4060; transform: translateY(-1px); }
  .card.active { border-color: var(--accent); }
  .card.playing { border-color: var(--green); box-shadow: 0 0 0 1px #34d39922; }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
  }

  .q-num {
    min-width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--border);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }

  .card.active .q-num { background: var(--accent); color: #fff; }
  .card.playing .q-num { background: var(--green); color: #fff; }

  .q-text {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 500;
    line-height: 1.5;
    padding-top: 4px;
  }

  .play-btn {
    min-width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.18s;
    flex-shrink: 0;
  }

  .play-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .play-btn.is-playing { background: var(--green); border-color: var(--green); color: #fff; }
  .play-btn.loading { background: var(--border); animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .answer-panel {
    display: none;
    padding: 0 18px 18px 62px;
    animation: fadeSlide 0.22s ease;
  }
  .answer-panel.open { display: block; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .answer-inner {
    background: var(--surface);
    border-radius: 10px;
    padding: 14px 16px;
    border-left: 3px solid var(--accent);
    font-size: 0.875rem;
    line-height: 1.7;
  }

  .card.playing .answer-inner { border-left-color: var(--green); }

  .waveform {
    display: none;
    align-items: center;
    gap: 3px;
    margin-top: 10px;
    height: 22px;
  }
  .waveform.vis { display: flex; }
  .waveform span {
    width: 3px;
    border-radius: 3px;
    background: var(--green);
    animation: wave 0.9s infinite ease-in-out;
    min-height: 4px;
  }
  .waveform span:nth-child(1){animation-delay:0s;height:8px}
  .waveform span:nth-child(2){animation-delay:.1s;height:16px}
  .waveform span:nth-child(3){animation-delay:.2s;height:22px}
  .waveform span:nth-child(4){animation-delay:.15s;height:14px}
  .waveform span:nth-child(5){animation-delay:.05s;height:8px}
  .waveform span:nth-child(6){animation-delay:.25s;height:18px}
  .waveform span:nth-child(7){animation-delay:.1s;height:10px}

  @keyframes wave {
    0%,100%{transform:scaleY(0.4);opacity:0.6}
    50%{transform:scaleY(1);opacity:1}
  }

  .stats-bar {
    display: flex;
    gap: 20px;
    justify-content: center;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat { display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--muted); }
  .stat strong { color: var(--text); font-weight: 600; }

  /* error notice */
  .tts-notice {
    display: none;
    background: #2d1f0e;
    border: 1px solid #7c4a1a;
    border-radius: 10px;
    padding: 12px 16px;
    margin: 16px auto;
    max-width: 780px;
    font-size: 0.82rem;
    color: #fbbf24;
    line-height: 1.6;
  }
  .tts-notice.show { display: block; }

  /* now playing bar */
  .now-playing-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(26,29,39,0.97);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: none;
    align-items: center;
    gap: 14px;
    backdrop-filter: blur(16px);
    z-index: 200;
  }
  .now-playing-bar.visible { display: flex; }
  .np-info { flex: 1; min-width: 0; }
  .np-q { font-size: 0.75rem; color: var(--green); font-weight: 600; margin-bottom: 2px; }
  .np-text { font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-controls { display: flex; gap: 8px; }
  .np-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.18s; font-size: 0.9rem;
  }
  .np-btn:hover { background: var(--accent); border-color: var(--accent); }
  .np-btn.stop-btn:hover { background: #ef4444; border-color: #ef4444; }
</style>
</head>
<body>

<header>
  <h1>Müsahibə Sualları</h1>
  <p>Fiziki Tərbiyə Müəllimi · 17 Sual</p>
</header>

<div class="stats-bar">
  <div class="stat">📋 <strong>17</strong> sual</div>
  <div class="stat">✅ <strong id="openedQ">0</strong> açılıb</div>
  <div class="stat">🔊 <strong id="nowQ">—</strong> indi oxunur</div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="controls">
  <button class="ctrl-btn" id="playAllBtn" onclick="playAll()">▶ Hamısını Oxu</button>
  <button class="ctrl-btn" id="pauseBtn" onclick="pauseResume()" style="display:none">⏸ Dayan</button>
  <button class="ctrl-btn" id="stopBtn" onclick="stopAll()" style="display:none">⏹ Dayandır</button>
  <button class="ctrl-btn" onclick="expandAll()">⊞ Hamısını Aç</button>
  <button class="ctrl-btn" onclick="collapseAll()">⊟ Hamısını Bağla</button>
  <select class="speed-select" id="speedSelect">
    <option value="0.75">🐢 Yavaş</option>
    <option value="1" selected>🚶 Normal</option>
    <option value="1.25">🏃 Sürətli</option>
  </select>
</div>

<div class="tts-notice" id="ttsNotice">
  ⚠️ <strong>Səs yüklənə bilmədi.</strong> Bu, adətən CORS məhdudiyyəti səbəbindən olur. 
  Faylı <strong>GitHub Pages</strong>-dən açdığınızda tam işləyəcək. 
  Yerli test üçün brauzerinizdə <code>--disable-web-security</code> rejimini sınayın.
</div>

<div class="container" id="cardsContainer"></div>

<div class="now-playing-bar" id="nowPlayingBar">
  <div class="np-info">
    <div class="np-q" id="npQ">—</div>
    <div class="np-text" id="npText">—</div>
  </div>
  <div class="np-controls">
    <button class="np-btn" onclick="playPrev()" title="Əvvəlki">◀</button>
    <button class="np-btn" onclick="pauseResume()" id="npPauseBtn">⏸</button>
    <button class="np-btn" onclick="playNext()" title="Növbəti">▶</button>
    <button class="np-btn stop-btn" onclick="stopAll()">⏹</button>
  </div>
</div>

<!-- hidden audio player -->
<audio id="ttsAudio" preload="none"></audio>

<script>
const data = [
  { q: "Şagirdə rəyi necə verirsiz?", a: "Rəyi vaxtında, spesifik və həvəsləndirici verirəm. Səhvini yox, necə düzəldə biləcəyini göstərirəm. Məsələn, topu yaxşı tutursan, sadəcə qollarını biraz da elastik saxla." },
  { q: "Əks-əlaqə nədir?", a: "Əks-əlaqə şagirdin harada olduğunu və hədəfə çatmaq üçün nə etməli olduğunu göstərən körpüdür. Təlim prosesini inkişaf etdirən əsas vasitədir." },
  { q: "İstifadə etdiyiniz təlim üsulları hansılardır?", a: "Əsasən nümayiş etdirmə, yəni demonstrasiya, rollu oyunlar, estafetlər və bütün bədən hərəkəti, yəni TPR üsullarından geniş istifadə edirəm." },
  { q: "Şagirdlər sizi əsəbiləşdirəndə necə davranırsız?", a: "Sakitliyimi qoruyuram, emosiya ilə yox, təmkinlə reaksiya verirəm. Şagirdlə fərdi danışıb səbəbini öyrənirəm və qaydaları xatırladıram." },
  { q: "İnklüzivlik nədir?", a: "İnklüzivlik, fiziki, psixoloji və ya sosial fərqindən asılı olmayaraq bütün uşaqların bərabər şəkildə təhsilə cəlb olunmasıdır." },
  { q: "İnteraktiv təlim nədir?", a: "Şagirdin passiv dinləyici deyil, dərsin fəal iştirakçısı olduğu, əməkdaşlığa və təcrübəyə söykənən təlimdir." },
  { q: "Müsahibə mərhələsi sizcə nə üçün vacibdir?", a: "Müəllimin yalnız nəzəri biliyini yox, onun ünsiyyət bacarığını, pedaqoji təfəkkürünü və psixoloji hazırlığını qiymətləndirmək üçün vacibdir." },
  { q: "Şagirdlərlə işləyəndə hansı çətinlik olur sizin üçün?", a: "Bəzən şagirdlərin idman dərsində həddindən artıq həyəcanlı və ya passiv olması çətinlik yaradır. Amma fərdi yanaşma ilə bu balansı qururam." },
  { q: "Sinifinizdə daha çox hansı intellektə sahib şagirdlər var?", a: "Fiziki tərbiyə dərsi olduğu üçün daha çox bədən-kinestetik və məkan-vizual intellektə sahib şagirdlər üstünlük təşkil edir." },
  { q: "Sinifdə ən çox tətbiqinə üstünlük verdiyiniz metod?", a: "Dizaynı praktiki olduğu üçün nümayiş etdirmə, yəni göstərərək öyrətmə, və praktiki tapşırıqlar metoduna üstünlük verirəm." },
  { q: "Sinifdə təhlükəsiz mühiti necə qurmaq olar?", a: "İlk növbədə zalı və inventarları yoxlayıram, təhlükəsizlik qaydalarını dərsin başında xatırladıram və psixoloji olaraq sağlam, dəstəkləyici mühit yaradıram." },
  { q: "Bullinq nədir?", a: "Bir və ya bir neçə şagirdin başqa bir şagirdə qarşı təkrarən etdiyi fiziki, psixoloji və ya şifahi zorakılıqdır." },
  { q: "Fiziki qüsurlu şagirdlərlə necə davranırsız?", a: "Onları kənarda saxlamıram. Sağlamlıq imkanlarına uyğun xüsusi adaptasiya olunmuş hərəkətlər verib komandaya inteqrasiya edirəm." },
  { q: "Bizdən gözləntiniz?", a: "Obyektiv qiymətləndirmə və pedaqoji fəaliyyətimi daha da inkişaf etdirmək üçün dəyərli tövsiyələr almaq." },
  { q: "Müəllim kimi işləməyin hansı çətinlikləri var?", a: "Müxtəlif xasiyyətli uşaqların hər birinə fərdi yanaşma tapmaq və təhlükəsizliyi hər an nəzarətdə saxlamaq məsuliyyəti." },
  { q: "Dərs planı nə üçün vacibdir?", a: "Dərsin məqsədinə vaxtında və sistemli çatmaq, vaxtı düzgün bölmək və dərsi təsadüflərə buraxmamaq üçün vacibdir." },
  { q: "Hansı iş formaları var?", a: "Dörd iş forması var: Fərdi iş, Cütlərlə iş, Qrupla iş və Bütün siniflə, yəni kütləvi iş." }
];

/* ── TTS via Google Translate ── */
function ttsUrl(text) {
  // Split text into ≤200-char chunks to stay within URL limits
  return 'https://translate.google.com/translate_tts?ie=UTF-8&tl=az&client=tw-ob&q=' +
    encodeURIComponent(text.slice(0, 200));
}

const audio = document.getElementById('ttsAudio');
let currentIdx   = -1;
let playAllMode  = false;
let openedSet    = new Set();

// Queue of text chunks for current card
let chunkQueue   = [];
let chunkPlaying = false;

function getSpeed() {
  return parseFloat(document.getElementById('speedSelect').value);
}

/* Split long text into sentence-sized chunks ≤180 chars */
function splitChunks(text) {
  const sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
  const chunks = [];
  let cur = '';
  for (const s of sentences) {
    if ((cur + s).length > 180) {
      if (cur) chunks.push(cur.trim());
      cur = s;
    } else {
      cur += s;
    }
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks.length ? chunks : [text.slice(0, 180)];
}

function playChunkQueue(onDone) {
  if (!chunkQueue.length) { onDone && onDone(); return; }
  const chunk = chunkQueue.shift();
  audio.src = ttsUrl(chunk);
  audio.playbackRate = getSpeed();
  audio.onended = () => playChunkQueue(onDone);
  audio.onerror = () => {
    document.getElementById('ttsNotice').classList.add('show');
    onDone && onDone();
  };
  audio.play().catch(() => {
    document.getElementById('ttsNotice').classList.add('show');
    onDone && onDone();
  });
}

function speakCard(i, onDone) {
  stopAudio();
  currentIdx = i;
  setPlayingCard(i);

  // Build text: sual + cavab
  const text = `Sual ${i + 1}. ${data[i].q}. Cavab. ${data[i].a}`;
  chunkQueue = splitChunks(text);
  chunkPlaying = true;
  document.getElementById('npPauseBtn').textContent = '⏸';
  playChunkQueue(() => {
    chunkPlaying = false;
    if (onDone) onDone();
    else clearPlaying();
  });
}

function stopAudio() {
  audio.pause();
  audio.src = '';
  chunkQueue = [];
  chunkPlaying = false;
}

function clearPlaying() {
  setPlayingCard(-1);
  document.getElementById('playAllBtn').style.display = '';
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'none';
}

function pauseResume() {
  if (audio.paused) {
    audio.play();
    document.getElementById('pauseBtn').textContent = '⏸ Dayan';
    document.getElementById('npPauseBtn').textContent = '⏸';
  } else {
    audio.pause();
    document.getElementById('pauseBtn').textContent = '▶ Davam Et';
    document.getElementById('npPauseBtn').textContent = '▶';
  }
}

function stopAll() {
  playAllMode = false;
  stopAudio();
  clearPlaying();
  document.getElementById('pauseBtn').textContent = '⏸ Dayan';
  document.getElementById('npPauseBtn').textContent = '⏸';
}

function playNext() {
  const next = currentIdx + 1;
  if (next < data.length) {
    if (playAllMode) playAllRecursive(next);
    else {
      showControls();
      speakCard(next);
    }
  }
}

function playPrev() {
  const prev = currentIdx - 1;
  if (prev >= 0) { showControls(); speakCard(prev); }
}

function showControls() {
  document.getElementById('playAllBtn').style.display = 'none';
  document.getElementById('pauseBtn').style.display = '';
  document.getElementById('stopBtn').style.display = '';
}

function playAllRecursive(i) {
  if (i >= data.length || !playAllMode) {
    if (i >= data.length) stopAll();
    return;
  }
  showControls();
  speakCard(i, () => { if (playAllMode) playAllRecursive(i + 1); });
}

function playAll() {
  playAllMode = true;
  playAllRecursive(0);
}

/* ── Card UI ── */
function setPlayingCard(i) {
  data.forEach((_, j) => {
    const card = document.getElementById(`card-${j}`);
    const btn  = document.getElementById(`playBtn-${j}`);
    const wave = document.getElementById(`wave-${j}`);
    card.classList.remove('playing');
    btn.classList.remove('is-playing');
    wave.classList.remove('vis');
    btn.innerHTML = iconPlay();
  });

  if (i < 0) {
    document.getElementById('nowPlayingBar').classList.remove('visible');
    document.getElementById('nowQ').textContent = '—';
    document.getElementById('progressFill').style.width = '0%';
    return;
  }

  const card = document.getElementById(`card-${i}`);
  const btn  = document.getElementById(`playBtn-${i}`);
  const wave = document.getElementById(`wave-${i}`);
  card.classList.add('playing');
  card.classList.remove('active');
  btn.classList.add('is-playing');
  btn.innerHTML = iconPause();
  wave.classList.add('vis');

  document.getElementById(`panel-${i}`).classList.add('open');
  openedSet.add(i);
  updateStats();
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });

  document.getElementById('nowPlayingBar').classList.add('visible');
  document.getElementById('npQ').textContent = `Sual ${i+1} / ${data.length}`;
  document.getElementById('npText').textContent = data[i].q;
  document.getElementById('nowQ').textContent = i + 1;
  document.getElementById('progressFill').style.width = ((i+1)/data.length*100) + '%';
}

function iconPlay() {
  return `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1.5l9 4.5-9 4.5z"/></svg>`;
}
function iconPause() {
  return `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="2" width="3" height="8"/><rect x="7" y="2" width="3" height="8"/></svg>`;
}

function toggleCard(i) {
  const panel = document.getElementById(`panel-${i}`);
  const card  = document.getElementById(`card-${i}`);
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    card.classList.remove('active');
    openedSet.delete(i);
  } else {
    panel.classList.add('open');
    card.classList.add('active');
    openedSet.add(i);
  }
  updateStats();
}

function expandAll() {
  data.forEach((_, i) => {
    document.getElementById(`panel-${i}`).classList.add('open');
    document.getElementById(`card-${i}`).classList.add('active');
    openedSet.add(i);
  });
  updateStats();
}

function collapseAll() {
  data.forEach((_, i) => {
    document.getElementById(`panel-${i}`).classList.remove('open');
    document.getElementById(`card-${i}`).classList.remove('active');
    openedSet.delete(i);
  });
  updateStats();
}

function updateStats() {
  document.getElementById('openedQ').textContent = openedSet.size;
}

function onCardPlayBtn(e, i) {
  e.stopPropagation();
  if (currentIdx === i && chunkPlaying) { pauseResume(); return; }
  showControls();
  playAllMode = false;
  speakCard(i);
}

function buildCards() {
  const cont = document.getElementById('cardsContainer');
  data.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${i}`;
    card.innerHTML = `
      <div class="card-header" onclick="toggleCard(${i})">
        <div class="q-num">${String(i+1).padStart(2,'0')}</div>
        <div class="q-text">${item.q}</div>
        <button class="play-btn" id="playBtn-${i}" onclick="onCardPlayBtn(event,${i})" title="Oxu / Dayan">
          ${iconPlay()}
        </button>
      </div>
      <div class="answer-panel" id="panel-${i}">
        <div class="answer-inner">${item.a}</div>
        <div class="waveform" id="wave-${i}">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>`;
    cont.appendChild(card);
  });
}

buildCards();
</script>
</body>
</html>
