<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiziki Tərbiyə</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;
  --sur:#f8f8f8;
  --bor:#e3e3e3;
  --txt:#111;
  --sub:#777;
  --grn:#16a34a;
  --grn-bg:#f0fdf4;
  --grn-br:#86efac;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --red-br:#fca5a5;
  --nav:26px;
  --rad:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.screen{display:none;width:100%}
.screen.on{display:flex}

/* START */
#ss{min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
.badge{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--sub);border:1px solid var(--bor);padding:.3rem .9rem;border-radius:100px;margin-bottom:1.8rem}
.sh{font-family:'DM Serif Display',serif;font-size:clamp(1.9rem,5vw,3rem);line-height:1.1;margin-bottom:.5rem}
.sh em{font-style:italic;color:var(--sub)}
.ssub{font-size:.88rem;color:var(--sub);margin-bottom:2rem}
.mrow{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.5rem}
.mi{text-align:center}
.mn{display:block;font-family:'DM Serif Display',serif;font-size:2rem;line-height:1}
.ml{display:block;font-size:.7rem;color:var(--sub);text-transform:uppercase;letter-spacing:.1em;margin-top:.2rem}
.mdiv{width:1px;height:36px;background:var(--bor);align-self:center}
.bgo{background:var(--txt);color:#fff;border:none;padding:.85rem 3rem;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;border-radius:100px;cursor:pointer;transition:all .2s}
.bgo:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.15)}

/* QUIZ */
#sq{flex-direction:column;align-items:center;padding:1.4rem 1rem 3rem}

.topbar{width:100%;max-width:780px;display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:1rem}
.tl{display:flex;align-items:center;gap:.8rem}
.qcnt{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--sub)}
.pw{width:110px;height:3px;background:var(--bor);border-radius:99px;overflow:hidden}
.pf{height:100%;background:var(--txt);border-radius:99px;transition:width .4s ease}

.tw{display:flex;align-items:center;gap:.45rem}
.tr{width:36px;height:36px;position:relative;flex-shrink:0}
.tr svg{transform:rotate(-90deg)}
.tr .tbg{fill:none;stroke:var(--bor);stroke-width:3}
.tr .tfg{fill:none;stroke:#16a34a;stroke-width:3;stroke-linecap:round;stroke-dasharray:100.53;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .3s}
.tnum{font-family:'DM Serif Display',serif;font-size:1.05rem;min-width:30px;text-align:right;color:#16a34a;transition:color .3s}
.tnum.warn{color:#d97706}.tnum.dng{color:#dc2626}

/* nav grid */
.ngw{width:100%;max-width:780px;margin-bottom:1.2rem;overflow-x:auto;padding-bottom:3px}
.ng{display:flex;flex-wrap:wrap;gap:4px}
.nb{width:var(--nav);height:var(--nav);border:1.5px solid var(--bor);background:#fff;font-size:.6rem;font-weight:600;color:var(--sub);cursor:pointer;border-radius:4px;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'DM Sans',sans-serif}
.nb:hover{border-color:var(--txt);color:var(--txt)}
.nb.cur{border-color:var(--txt);background:var(--txt);color:#fff}
.nb.ok{border-color:var(--grn);background:var(--grn-bg);color:var(--grn)}
.nb.bad{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.nb.tout{border-color:#f59e0b;background:#fffbeb;color:#d97706}
.nb.skip{border-color:#94a3b8;background:#f8fafc;color:#94a3b8}

/* card */
.qcard{width:100%;max-width:780px;background:#fff;border:1px solid var(--bor);border-radius:var(--rad);padding:1.8rem 1.8rem 1.5rem;margin-bottom:1.1rem}
.qmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.qnum{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--sub)}
.qscore{font-size:.72rem;color:var(--sub);background:var(--sur);padding:.2rem .6rem;border-radius:100px}
.qtext{font-family:'DM Serif Display',serif;font-size:1.1rem;line-height:1.6;color:var(--txt);margin-bottom:1.5rem;white-space:pre-line}

/* options - flex column for 5 options */
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{display:flex;align-items:flex-start;gap:.65rem;padding:.7rem .9rem;border:1.5px solid var(--bor);border-radius:8px;background:#fff;cursor:pointer;text-align:left;transition:all .15s;font-family:'DM Sans',sans-serif;width:100%}
.opt:hover:not(.done){border-color:var(--txt);background:var(--sur)}
.ol{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;min-width:22px;border:1.5px solid var(--bor);border-radius:4px;font-size:.68rem;font-weight:700;color:var(--sub);background:var(--sur);margin-top:2px;transition:all .15s;flex-shrink:0;font-family:'DM Sans',sans-serif}
.ot{font-size:.88rem;line-height:1.45;color:var(--txt);flex:1}

.opt.ok{border-color:var(--grn);background:var(--grn-bg);animation:pop .25s ease}
.opt.ok .ol{border-color:var(--grn);background:var(--grn);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-bg);animation:shk .35s ease}
.opt.bad .ol{border-color:var(--red);background:var(--red);color:#fff}
.opt.show-ok{border-color:var(--grn);background:var(--grn-bg)}
.opt.show-ok .ol{border-color:var(--grn);background:var(--grn);color:#fff}
.opt.done{cursor:default}

@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.exp{display:none;margin-top:.9rem;padding:.7rem .95rem;background:var(--sur);border-left:3px solid var(--txt);border-radius:0 6px 6px 0;font-size:.82rem;color:var(--sub);line-height:1.55;animation:fu .25s ease}
.exp.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* controls */
.ctrl{width:100%;max-width:780px;display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.cbtn{display:flex;align-items:center;gap:.45rem;padding:.6rem 1.3rem;border:1.5px solid var(--bor);border-radius:100px;background:#fff;font-family:'DM Sans',sans-serif;font-size:.86rem;font-weight:500;color:var(--txt);cursor:pointer;transition:all .15s}
.cbtn:hover{border-color:var(--txt);background:var(--sur)}
.cbtn:disabled{opacity:.3;cursor:not-allowed}
.cbtn.pri{background:var(--txt);color:#fff;border-color:var(--txt)}
.cbtn.pri:hover{background:#333}

/* RESULT */
#sr{min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
.rring{width:130px;height:130px;position:relative;margin:0 auto 1.2rem}
.rring svg{transform:rotate(-90deg)}
.rring .rbg{fill:none;stroke:var(--bor);stroke-width:7}
.rring .rfg{fill:none;stroke:#16a34a;stroke-width:7;stroke-linecap:round;stroke-dasharray:339;stroke-dashoffset:339;transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)}
.rinn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.rpct{font-family:'DM Serif Display',serif;font-size:2rem;line-height:1}
.rlbl{font-size:.68rem;color:var(--sub);text-transform:uppercase;letter-spacing:.1em}
.rh{font-family:'DM Serif Display',serif;font-size:1.7rem;margin-bottom:.4rem}
.rs{font-size:.88rem;color:var(--sub);margin-bottom:1.6rem}
.rstats{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.8rem}
.sbox{padding:.9rem 1.3rem;border:1px solid var(--bor);border-radius:var(--rad);min-width:90px}
.sn{font-family:'DM Serif Display',serif;font-size:1.7rem;display:block}
.sn.g{color:var(--grn)}.sn.r{color:var(--red)}.sn.y{color:#d97706}.sn.gr{color:#94a3b8}
.sl{font-size:.68rem;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}

.tflash{position:fixed;inset:0;background:rgba(220,38,38,.07);pointer-events:none;opacity:0;transition:opacity .3s;z-index:999}
.tflash.on{opacity:1}
</style>
</head>
<body>
<div class="tflash" id="tf"></div>

<!-- START -->
<div class="screen on" id="ss">
  <span class="badge">Fiziki Tərbiyə</span>
  <h1 class="sh">İmtahan Testi<br><em>60 Sual</em></h1>
  <p class="ssub">Hər suala 3 dəqiqə vaxt ayrılır · Cavabladıqdan sonra avtomatik keçmir</p>
  <div class="mrow">
    <div class="mi"><span class="mn">60</span><span class="ml">Sual</span></div>
    <div class="mdiv"></div>
    <div class="mi"><span class="mn">3:00</span><span class="ml">Hər suala</span></div>
    <div class="mdiv"></div>
    <div class="mi"><span class="mn">A–E</span><span class="ml">Variant</span></div>
  </div>
  <button class="bgo" onclick="startQuiz()">Testi Başlat →</button>
</div>

<!-- QUIZ -->
<div class="screen" id="sq">
  <div class="topbar">
    <div class="tl">
      <span class="qcnt" id="qcnt">1 / 60</span>
      <div class="pw"><div class="pf" id="pf" style="width:0%"></div></div>
    </div>
    <div class="tw">
      <div class="tr">
        <svg viewBox="0 0 38 38" width="36" height="36">
          <circle class="tbg" cx="19" cy="19" r="16"/>
          <circle class="tfg" id="tcirc" cx="19" cy="19" r="16"/>
        </svg>
      </div>
      <span class="tnum" id="tdisp">3:00</span>
    </div>
  </div>

  <div class="ngw"><div class="ng" id="navg"></div></div>

  <div class="qcard">
    <div class="qmeta">
      <span class="qnum" id="qbadge">Sual 1</span>
      <span class="qscore" id="qscore">– / 60</span>
    </div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="exp" id="exp"></div>
  </div>

  <div class="ctrl">
    <button class="cbtn" id="bp" onclick="goTo(cur-1)">← Geri</button>
    <button class="cbtn" id="bsk" onclick="skipQ()">Burax</button>
    <button class="cbtn pri" id="bn" onclick="nxtAct()">İrəli →</button>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="sr">
  <div class="rring">
    <svg width="130" height="130" viewBox="0 0 130 130">
      <circle class="rbg" cx="65" cy="65" r="54"/>
      <circle class="rfg" id="rarc" cx="65" cy="65" r="54"/>
    </svg>
    <div class="rinn">
      <div class="rpct" id="rpct">0%</div>
      <div class="rlbl">Nəticə</div>
    </div>
  </div>
  <h2 class="rh" id="rtit">–</h2>
  <p class="rs" id="rsub">–</p>
  <div class="rstats">
    <div class="sbox"><span class="sn g" id="rc">0</span><span class="sl">Düzgün</span></div>
    <div class="sbox"><span class="sn r" id="rw">0</span><span class="sl">Yanlış</span></div>
    <div class="sbox"><span class="sn y" id="rt">0</span><span class="sl">Vaxt bitdi</span></div>
    <div class="sbox"><span class="sn gr" id="rsk">0</span><span class="sl">Buraxıldı</span></div>
  </div>
  <button class="bgo" onclick="restartQ()">Yenidən Başlat →</button>
</div>

<script>
// ── DATA (PDF-dən, olduğu kimi) ──────────────────────────────────────────────
const ORIG = [
  {
    "q": "1. Basketbol oyununda şagird topu yerə vuraraq aparmalı, eyni zamanda müəllimin fiti ilə dərhal dayanıb topu səbətə atmalıdır. Şagirdlərdən biri qaçarkən topu yaxşı idarə etsə də, dayanma anında müvazinətini itirir və atış üçün lazım olan bədən vəziyyətini (ayaqların və qolların uzlaşmasını) vaxtında qura bilmir. Müəllim izah edir ki, bu, bədənin hərəkət sürəti ilə məkan daxilindəki hərəkətlərin bir-birinə uyğunlaşdırılmamasıdır.\n\nŞagirdin hərəkət zamanı bədənini zaman və məkan daxilində nizamlayaraq müxtəlif hərəkətləri (qaçış, dayanma, atış) vahid bir sistemdə birləşdirə bilməməsi onun hansı hərəki qabiliyyətinin zəif olduğunu göstərir?",
    "opts": [
      "A) Sürət",
      "B) Dözümlülük",
      "C) Güc",
      "D) Hərəki koordinasiya",
      "E) Əyilgənlik"
    ],
    "ans": 3
  },
  {
    "q": "2. Dinamik müvazinət statik müvazinətdən nə ilə fərqlənir?",
    "opts": [
      "A) Hərəkətsiz vəziyyətdə saxlanılması ilə",
      "B) Gözlərin bağlı olması ilə",
      "C) Yerdəyişmə zamanı istiqamətin və tarazlığın saxlanılması ilə",
      "D) Əzələlərin daha çox gərilməsi ilə",
      "E) Yalnız akrobatik hərəkətlərdə tətbiq olunması ilə"
    ],
    "ans": 2
  },
  {
    "q": "3. Dəqiq icranın komponentlərinə aid olmayan variantı seçin:",
    "opts": [
      "A) Ölçmə dəqiqliyi",
      "B) Hədəf dəqiqliyi",
      "C) Koordinasiya",
      "D) Siqnallara dəqiq cavab vermə",
      "E) Verilmiş statik vəziyyətin qorunması"
    ],
    "ans": 2
  },
  {
    "q": "4. Dözümlülük qabiliyyətinə aid olanları seçin.\n1. Əzələ gərginliyinin uzun müddət statik vəziyyətdə saxlanılması\n2. Ritmik asta qaçış-120 m\n3. Dabanları sağrı əzələlərinə çatdırmaqla qaçış\n4. Bir əllə tək qıçla oturub-durmaq\n5. Hər iki qıçın təkanı ilə sağa-sola çoxsaylı tullanmalar",
    "opts": [
      "A) 1,2,3",
      "B) 1,2,5",
      "C) 2,3,4",
      "D) 2,3,5",
      "E) 1,3,4"
    ],
    "ans": 0
  },
  {
    "q": "5. Fiziki tərbiyə müəlliminin vəzifəsinə aid deyil:",
    "opts": [
      "A) İdman qurğuları inşa etmək",
      "B) Oyunları təşkil etmək",
      "C) Təhlükəsizliyi təmin etmək",
      "D) Şagirdlərə nəzarət etmək",
      "E) Dərsi qurmaq"
    ],
    "ans": 0
  },
  {
    "q": "6. Dözümlülüyün tərkib komponentləri hansılardır?\n1. Qüvvə dözümlülüyü\n2. Sürət dözümlülüyü\n3. Koordinasiya dözümlülüyü\n4. Ümumi dözümlülük\n5. Xüsusi dözümlülük\n6. Statik dözümlülük\n7. Dinamik dözümlülük",
    "opts": [
      "A) 1.2",
      "B) 4.5",
      "C) 6.7",
      "D) 2.4",
      "E) 2.3"
    ],
    "ans": 3
  },
  {
    "q": "7. Şagird sərbəst olaraq ətraf mühitdən, öz ağırlığından və dartma hərəkətlərindən maksimal istifadə edir. Hansı əyilənliyə aiddir?",
    "opts": [
      "A) Dinamik fəal hərəkətlər",
      "B) Dinamik qeyri-fəal hərəkətlər",
      "C) Statik hərəkətlər",
      "D) Statik qeyri-fəal hərəkətlər",
      "E) Qarışıq hərəkətlər"
    ],
    "ans": 1
  },
  {
    "q": "8. Məktəbin idman meydançasında üçtəkanla tullanma üzrə seçim yarışları keçirilir. Müəllim meydançanı beynəlxalq standartlara uyğun hazırlamaq üçün təkan lövhəsini qum hovuzundan müəyyən məsafədə yerləşdirir. O qeyd edir ki, bu məsafə idmançının \"sıçrayış\", \"addım\" və \"tullanma\" fazalarını tam yerinə yetirib qum hovuzuna təhlükəsiz enməsi üçün hesablanmışdır.\n\nKeçirilən rəsmi yarışlarda müəllimin təkan lövhəsi ilə qum hovuzu arasında qoymalı olduğu standart məsafə nə qədərdir?",

    "ans": 2
  },
  {

    "opts": [

      "B) Sürət",
      "C) BƏQ",

      "B) 2",
      "C) 3",
      "D) 4",
      "E) 5"
    ],
    "ans": 2
  },
  {
    "q": "13. Sürət qabiliyyətinin inkişafını şərtləndirən amillərə aiddir?",

    "ans": 2

  {

    "opts": [
      "A) 1-c, 2-a, 3-b",
      "B) 1-a, 2-b, 3-c",

  {

  {

// ── STATE ────────────────────────────────────────────────────────────────────
let qs=[],cur=0,ans=[],tid=null,tl=180;
const TT=180;

// ── AUDIO ────────────────────────────────────────────────────────────────────
let actx=null;
function aC(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function snd(t){
  try{
    const c=aC(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    if(t==='ok'){
      o.frequency.setValueAtTime(523,c.currentTime);
      o.frequency.setValueAtTime(659,c.currentTime+.1);
      o.frequency.setValueAtTime(784,c.currentTime+.2);
      g.gain.setValueAtTime(.16,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
      o.start(c.currentTime);o.stop(c.currentTime+.5);
    }else if(t==='bad'){
      o.frequency.setValueAtTime(220,c.currentTime);
      o.frequency.setValueAtTime(160,c.currentTime+.18);
      g.gain.setValueAtTime(.16,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.45);
      o.start(c.currentTime);o.stop(c.currentTime+.45);
    }else if(t==='tout'){
      [0,.18,.36].forEach((d,i)=>{
        const o2=c.createOscillator(),g2=c.createGain();
        o2.connect(g2);g2.connect(c.destination);
        o2.frequency.value=400-i*80;
        g2.gain.setValueAtTime(.13,c.currentTime+d);
        g2.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.15);
        o2.start(c.currentTime+d);o2.stop(c.currentTime+d+.15);
      });
    }else if(t==='nav'){
      o.frequency.value=440;
      g.gain.setValueAtTime(.07,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.07);
      o.start(c.currentTime);o.stop(c.currentTime+.07);
    }else if(t==='fin'){
      [523,659,784,1047].forEach((f,i)=>{
        const o2=c.createOscillator(),g2=c.createGain();
        o2.connect(g2);g2.connect(c.destination);
        o2.frequency.value=f;
        g2.gain.setValueAtTime(.14,c.currentTime+i*.12);
        g2.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.12+.25);
        o2.start(c.currentTime+i*.12);o2.stop(c.currentTime+i*.12+.25);
      });
    }
  }catch(e){}
}

// ── SHUFFLE only QUESTIONS order (not options - PDF order kept) ──────────────
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function buildQs(){
  // Questions in original PDF order - no shuffle
  qs = ORIG.map(q => Object.assign({}, q));
  ans = new Array(qs.length).fill(null);
}

// ── NAV GRID ─────────────────────────────────────────────────────────────────
function buildNav(){
  const g=document.getElementById('navg');
  g.innerHTML='';
  qs.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='nb';b.textContent=i+1;b.id='nb'+i;
    b.onclick=()=>{snd('nav');goTo(i);};
    g.appendChild(b);
  });
}

function updNav(){
  qs.forEach((_,i)=>{
    const b=document.getElementById('nb'+i);
    if(!b)return;
    b.className='nb';
    if(i===cur){b.classList.add('cur');return;}
    const a=ans[i];if(!a)return;
    if(a.tout)b.classList.add('tout');
    else if(a.skip)b.classList.add('skip');
    else b.classList.add(a.ch===a.co?'ok':'bad');
  });
  const c=document.getElementById('nb'+cur);
  if(c)c.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

// ── TIMER ────────────────────────────────────────────────────────────────────
function startTimer(){
  clearInterval(tid);tl=TT;updTimer();
  tid=setInterval(()=>{tl--;updTimer();if(tl<=0){clearInterval(tid);onTimeout();}},1000);
}
function updTimer(){
  const m=Math.floor(tl/60),s=tl%60;
  document.getElementById('tcirc').style.strokeDashoffset=100.53*(1-tl/TT);
  const d=document.getElementById('tdisp');
  d.textContent=m+':'+(s<10?'0':'')+s;
  d.className='tnum';
  const fg=document.getElementById('tcirc');
  if(tl<=30){d.classList.add('dng');fg.style.stroke='#dc2626';}
  else if(tl<=60){d.classList.add('warn');fg.style.stroke='#d97706';}
  else fg.style.stroke='#16a34a';
}
function onTimeout(){
  snd('tout');
  ans[cur]={ch:-1,co:qs[cur].ans,tout:true};
  markDone(true);
  const tf=document.getElementById('tf');
  tf.classList.add('on');
  setTimeout(()=>tf.classList.remove('on'),600);
  updNav();updCtrl();
}

// ── SCORE ────────────────────────────────────────────────────────────────────
function getScore(){
  return ans.filter(a=>a&&!a.tout&&!a.skip&&a.ch===a.co).length;
}
function updScore(){
  document.getElementById('qscore').textContent=getScore()+' / '+qs.length;
}

// ── RENDER Q ─────────────────────────────────────────────────────────────────
function renderQ(i){
  const q=qs[i];
  document.getElementById('qbadge').textContent='Sual '+(i+1);
  document.getElementById('qcnt').textContent=(i+1)+' / '+qs.length;
  document.getElementById('qtext').textContent=q.q;
  document.getElementById('pf').style.width=((i+1)/qs.length*100)+'%';
  document.getElementById('exp').textContent='';
  document.getElementById('exp').className='exp';
  updScore();

  const og=document.getElementById('opts');
  og.innerHTML='';
  const letters=['A','B','C','D','E','F'];
  q.opts.forEach((o,j)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="ol">${letters[j]}</span><span class="ot">${o}</span>`;
    b.onclick=()=>handleAns(j);
    og.appendChild(b);
  });

  const a=ans[i];
  if(a){
    markDone(a.tout,true);
    // Show explanation with correct answer
    const co=qs[i].ans;
    const expEl=document.getElementById('exp');
    expEl.textContent='Düzgün cavab: '+letters[co]+') '+qs[i].opts[co];
    expEl.classList.add('on');
  }
  updNav();updCtrl();
}

function updCtrl(){
  const a=ans[cur];
  const allDone=ans.every(x=>x!==null);
  document.getElementById('bp').disabled=cur===0;
  document.getElementById('bsk').style.display=(a||allDone)?'none':'flex';
  const bn=document.getElementById('bn');
  if(cur===qs.length-1&&allDone)bn.textContent='Nəticə →';
  else bn.textContent='İrəli →';
}

// ── ANSWER ───────────────────────────────────────────────────────────────────
function handleAns(ch){
  if(ans[cur])return;
  clearInterval(tid);
  const co=qs[cur].ans;
  ans[cur]={ch,co};
  markDone(false);
  snd(ch===co?'ok':'bad');
  // Show correct answer letter
  const letters=['A','B','C','D','E','F'];
  const expEl=document.getElementById('exp');
  expEl.textContent='Düzgün cavab: '+letters[co]+') '+qs[cur].opts[co];
  expEl.classList.add('on');
  updScore();
  updNav();
  updCtrl();
  // NO auto-advance — user presses next
}

function markDone(isTimeout,noAnim=false){
  const q=qs[cur];
  const btns=document.querySelectorAll('.opt');
  btns.forEach((b,i)=>{
    b.classList.add('done');
    if(i===q.ans&&(isTimeout||ans[cur].ch!==q.ans))b.classList.add('show-ok');
    if(!isTimeout&&i===ans[cur].ch)b.classList.add(ans[cur].ch===q.ans?'ok':'bad');
  });
}

// ── NAV ──────────────────────────────────────────────────────────────────────
function nxtAct(){
  const allDone=ans.every(x=>x!==null);
  if(cur===qs.length-1&&allDone){showResult();return;}
  if(cur<qs.length-1)goTo(cur+1);
}

function goTo(i){
  if(i<0||i>=qs.length)return;
  cur=i;
  if(!ans[cur])startTimer();
  else clearInterval(tid);
  renderQ(cur);
}

function skipQ(){
  if(ans[cur])return;
  ans[cur]={ch:-1,co:qs[cur].ans,skip:true};
  updNav();updCtrl();
  // find next unanswered
  let nx=-1;
  for(let i=cur+1;i<qs.length;i++){if(!ans[i]){nx=i;break;}}
  if(nx===-1)for(let i=0;i<cur;i++){if(!ans[i]){nx=i;break;}}
  if(nx!==-1)goTo(nx);else showResult();
}

// ── SCREENS ──────────────────────────────────────────────────────────────────
function showScr(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

function startQuiz(){
  buildQs();buildNav();cur=0;
  showScr('sq');startTimer();renderQ(0);
}
function restartQ(){clearInterval(tid);startQuiz();}

function showResult(){
  clearInterval(tid);snd('fin');
  const c=ans.filter(a=>a&&!a.tout&&!a.skip&&a.ch===a.co).length;
  const w=ans.filter(a=>a&&!a.tout&&!a.skip&&a.ch!==a.co).length;
  const t=ans.filter(a=>a&&a.tout).length;
  const s=ans.filter(a=>a&&a.skip).length;
  const pct=Math.round(c/qs.length*100);
  document.getElementById('rc').textContent=c;
  document.getElementById('rw').textContent=w;
  document.getElementById('rt').textContent=t;
  document.getElementById('rsk').textContent=s;
  document.getElementById('rpct').textContent=pct+'%';
  document.getElementById('rtit').textContent=pct>=90?'Əla! 🏆':pct>=70?'Yaxşı! 👍':pct>=50?'Orta':'Yenidən cəhd et';
  document.getElementById('rsub').textContent=c+' düzgün / '+qs.length+' sualdan · '+pct+'%';
  const arc=document.getElementById('rarc');
  arc.style.stroke=pct>=70?'#16a34a':pct>=50?'#d97706':'#dc2626';
  showScr('sr');
  setTimeout(()=>{arc.style.strokeDashoffset=339*(1-pct/100);},100);
}
