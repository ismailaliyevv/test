<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Əzələ Rejimləri Testi</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f2eb;color:#1a1208;font-family:'Space Grotesk',sans-serif;min-height:100vh;padding:32px 16px 60px}
.wrap{max-width:820px;margin:0 auto}
.page-title{font-size:26px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.page-title span{color:#0f766e}
.page-sub{font-size:13px;color:#9a8c78;margin-bottom:26px}
.score-bar{background:#fff;border:1.5px solid #ddd7c9;border-radius:14px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sc-item .lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#9a8c78;display:block;margin-bottom:2px}
.sc-item .val{font-size:22px;font-weight:700}
.sc-item .val.g{color:#166534}
.sc-item .val.r{color:#991b1b}
.sc-item .val.t{color:#0f766e}
.reset-btn{padding:10px 20px;background:#1a1208;border:none;border-radius:10px;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.2s}
.reset-btn:hover{background:#0f766e}
.prog-bar{height:5px;background:#ddd7c9;border-radius:5px;overflow:hidden;margin-bottom:24px}
.prog-fill{height:100%;background:linear-gradient(90deg,#0f766e,#0d9488);border-radius:5px;transition:width .4s ease;width:0}
.q-block{background:#fff;border:1.5px solid #ddd7c9;border-radius:16px;overflow:hidden;margin-bottom:20px;box-shadow:0 3px 14px rgba(0,0,0,.06);animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-header{background:#1a1208;padding:13px 20px;display:flex;align-items:center;justify-content:space-between}
.q-num{font-size:12px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.5)}
.q-num b{color:#5eead4;font-size:15px}
.q-type{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.55)}
.q-body{padding:20px 20px 14px;border-bottom:1px solid #f5f2eb}
.q-text{font-size:15px;font-weight:600;line-height:1.7;color:#1a1208}
.q-text strong{color:#0f766e}
.bands{background:#faf8f4;border:1.5px solid #ddd7c9;border-radius:10px;padding:12px 16px;margin:14px 0 6px;list-style:none}
.bands li{font-size:13.5px;color:#3a2e1c;line-height:1.65;padding:4px 0;border-bottom:1px solid #ede8de}
.bands li:last-child{border-bottom:none}
.bands li span{font-weight:700;color:#0f766e;margin-right:4px}
.match-tbl{width:100%;border-collapse:collapse;margin:14px 0 6px;font-size:13.5px}
.match-tbl td{padding:10px 13px;border:1.5px solid #ddd7c9;vertical-align:top;line-height:1.55}
.match-tbl td:first-child{width:52%;background:#faf8f4;font-weight:500}
.match-tbl td:last-child{background:#f0fdfa;font-weight:500;color:#0f766e}
.match-tbl .mhdr td{background:#1a1208!important;color:#fff!important;font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:7px 13px}
.opts{padding:12px 14px 16px;display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:center;gap:11px;padding:11px 15px;background:#f7f4ee;border:1.5px solid #ddd7c9;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:'Space Grotesk',sans-serif;font-size:14px;color:#3a2e1c;font-weight:500;transition:all .18s}
.opt:hover:not([disabled]){border-color:#0f766e;background:#f0fdfa;transform:translateX(3px)}
.opt[disabled]{cursor:default}
.okey{min-width:26px;height:26px;border-radius:6px;background:#ddd7c9;font-size:11px;font-weight:700;color:#9a8c78;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.opt.correct{border-color:#166534!important;background:#f0fdf4!important}
.opt.correct .okey{background:#166534;color:#fff}
.opt.wrong{border-color:#991b1b!important;background:#fff1f0!important;animation:shk .3s ease}
.opt.wrong .okey{background:#991b1b;color:#fff}
.opt.show-ans{border-color:#166534!important;border-style:dashed!important;background:#f0fdf4!important}
.opt.show-ans .okey{background:#166534;color:#fff}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin:0 14px 14px;padding:11px 14px;border-radius:9px;font-size:13px;line-height:1.6;display:none}
.fb.show{display:block}
.fb.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;font-weight:500}
.fb.fail{background:#fff1f0;border:1px solid #fecaca;color:#991b1b;font-weight:500}
#cfw{position:fixed;inset:0;pointer-events:none;z-index:9999}
.cp{position:absolute;border-radius:2px;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-20px) rotate(0deg);opacity:1}to{transform:translateY(105vh) rotate(540deg);opacity:0}}
@media(max-width:540px){.q-text{font-size:14px}.opt{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-title">Əzələ <span>Rejimləri</span></div>
  <div class="page-sub">10 sual · Hər dəfə suallar və variantlar qarışır</div>
  <div class="score-bar">
    <div class="sc-item"><span class="lbl">Düzgün</span><span class="val g" id="sc">0</span></div>
    <div class="sc-item"><span class="lbl">Səhv</span><span class="val r" id="wc">0</span></div>
    <div class="sc-item"><span class="lbl">Tamamlandı</span><span class="val t" id="dc">0 / 10</span></div>
    <button class="reset-btn" onclick="startQuiz()">↺ Yenidən</button>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="pf"></div></div>
  <div id="qArea"></div>
</div>
<div id="cfw"></div>

<script>
// ─────────────────────────────────────────────────────────
// BÜTÜN SUALLAR BANK
// type: 'c' = seçim, 'b' = bənd seçimi, 'm' = uyğunluq
// opts: {t: mətn, c: true/false} — c:true düzgün cavabdır
// ─────────────────────────────────────────────────────────
const BANK = [

  // ── SEÇİM SUALLAR ──────────────────────────────────────

  { type:'c',
    q:'Defedici rejim əzələnin hansı vəziyyətini əks etdirir?',
    explain:'Defedici rejim = əzələlər YIĞILİR = "miometrik rejim". Güzəştedici açılır, izometrik uzunluq saxlayır, qarışıq hər ikisi dəyişir.',
    opts:[
      {t:'Əzələlər yığılır — "miometrik rejim"', c:true},
      {t:'Əzələnin uzunluğu dəyişmir, gərginlik artır', c:false},
      {t:'Əzələlər açılır — "polimetrik rejim"', c:false},
      {t:'Həm uzunluq, həm gərginlik eyni anda dəyişir', c:false},
    ]},

  { type:'c',
    q:'Şanq çiyinlərdə oturmaq hansı əzələ rejiminə misal kimi göstərilir?',
    explain:'Şanq çiyinlərdə oturmaqda əzələlər AÇILIR (polimetrik) → bu güzəştedici rejimədir. Defedici yox — orada əzələ yığılır.',
    opts:[
      {t:'Güzəştedici rejim (polimetrik)', c:true},
      {t:'Defedici rejim (miometrik)', c:false},
      {t:'İzometrik rejim', c:false},
      {t:'Qarışıq rejim', c:false},
    ]},

  { type:'c',
    q:'İrəli uzadılmış qollarda qantellərin saxlanılması hansı rejimə aiddir?',
    explain:'Qanteli saxlamaqda əzələnin UZUNLUĞU DƏYİŞMİR, yalnız gərginlik var → İZOMETRİK rejim.',
    opts:[
      {t:'İzometrik rejim — uzunluq dəyişmir', c:true},
      {t:'Güzəştedici rejim — əzələlər açılır', c:false},
      {t:'Defedici rejim — əzələlər yığılır', c:false},
      {t:'Qarışıq rejim — uzunluq və gərginlik dəyişir', c:false},
    ]},

  { type:'c',
    q:'Gimnastik halqalarda qüvvə ilə qalxıb "xaç" vəziyyətinə keçib saxlamaq hansı rejimə aiddir?',
    explain:'"Xaç"da həm əzələnin uzunluğu, həm gərginliyi dəyişir → QARIŞIQ rejim. İzometrik deyil — orada uzunluq sabitdir.',
    opts:[
      {t:'Qarışıq rejim', c:true},
      {t:'İzometrik rejim', c:false},
      {t:'Defedici rejim', c:false},
      {t:'Güzəştedici rejim', c:false},
    ]},

  { type:'c',
    q:'Güzəştedici rejim başqa cür necə adlandırılır?',
    explain:'Güzəştedici rejim = əzələlər AÇILIR = "POLİMETRİK rejim". Miometrik defedici rejimindir.',
    opts:[
      {t:'Polimetrik rejim', c:true},
      {t:'Miometrik rejim', c:false},
      {t:'İzometrik rejim', c:false},
      {t:'Dinamik rejim', c:false},
    ]},

  { type:'c',
    q:'İzometrik rejimin əsas xüsusiyyəti hansıdır?',
    explain:'İzometrik rejimdə UZUNLUQ DƏYİŞMİR, amma gərginlik artır. Defedici yığılır, güzəştedici açılır, qarışıq hər ikisi dəyişir.',
    opts:[
      {t:'Əzələ uzunluğu dəyişmir, gərginlik artır', c:true},
      {t:'Əzələlər yığılır, uzunluq qısalır', c:false},
      {t:'Əzələlər açılır, uzunluq artır', c:false},
      {t:'Həm uzunluq, həm gərginlik eyni anda dəyişir', c:false},
    ]},

  { type:'c',
    q:'Şanq ilə "qolların bükülüb-açılması" hərəkəti hansı rejimə misaldır?',
    explain:'"Qolların bükülüb-açılması"nda əzələ yığılır → DEFEDİCİ rejim (miometrik). Güzəştedici isə açılma rejimidir.',
    opts:[
      {t:'Defedici rejim', c:true},
      {t:'Güzəştedici rejim', c:false},
      {t:'İzometrik rejim', c:false},
      {t:'Qarışıq rejim', c:false},
    ]},

  // ── BƏND SEÇİMİ ───────────────────────────────────────

  { type:'b',
    q:'Aşağıdakı bəndlərdən hansılar <strong>defedici rejimə</strong> aiddir?',
    explain:'Defedici rejimə aid: 1 (yığılır) + 2 (miometrik adı) + 4 (şanq-qol bükmə misalı). 3-cü bənd güzəştediciyə (açılma) aiddir.',
    bands:[
      '1. Əzələlər yığılır',
      '2. "Miometrik rejim" adı ilə tanınır',
      '3. Əzələnin uzunluğu artır, açılma baş verir',
      '4. Şanq ilə "qolların bükülüb-açılması" misal göstərilir',
    ],
    opts:[
      {t:'1, 2, 4', c:true},
      {t:'2, 3, 4', c:false},
      {t:'1, 3, 4', c:false},
      {t:'1, 2, 3', c:false},
    ]},

  { type:'b',
    q:'Hansı bəndlər <strong>izometrik rejim</strong> haqqında düzgün məlumat verir?',
    explain:'İzometrik rejimə aid: 1 (uzunluq dəyişmir) + 2 (gərginlik artır) + 4 (qantel saxlama). 3-cü bənd güzəştediciyə (şanq çiyinlərdə oturmaq) aiddir.',
    bands:[
      '1. Əzələnin uzunluğu dəyişmir',
      '2. Əzələ gərginliyi artır',
      '3. Şanq çiyinlərdə oturmaq bu rejimə misaldır',
      '4. İrəli uzadılmış qollarda qantellərin saxlanılması bu rejimə misaldır',
    ],
    opts:[
      {t:'1, 2, 4', c:true},
      {t:'1, 2, 3', c:false},
      {t:'2, 3, 4', c:false},
      {t:'1, 3, 4', c:false},
    ]},

  // ── UYĞUNLUQ ─────────────────────────────────────────

  { type:'m',
    q:'Uyğunluğu müəyyən edin. Rejimi — misalı ilə uyğunlaşdırın.',
    explain:'1-C (defedici=qol bükmə), 2-D (güzəştedici=şanq oturmaq), 3-A (izometrik=qantel saxlama), 4-B (qarışıq=xaç).',
    left:[
      '1. Defedici rejim',
      '2. Güzəştedici rejim',
      '3. İzometrik rejim',
      '4. Qarışıq rejim',
    ],
    right:[
      'A) İrəli uzadılmış qollarda qantellərin saxlanılması',
      'B) Gimnastik halqalarda "xaç" vəziyyəti',
      'C) Şanq ilə qolların bükülüb-açılması',
      'D) Şanq çiyinlərdə oturmaq',
    ],
    opts:[
      {t:'1-C, 2-D, 3-A, 4-B', c:true},
      {t:'1-A, 2-C, 3-D, 4-B', c:false},
      {t:'1-C, 2-A, 3-B, 4-D', c:false},
      {t:'1-D, 2-C, 3-A, 4-B', c:false},
    ]},
];

// ─────────────────────────────────────────────────────────
// ENGINE
// ─────────────────────────────────────────────────────────
let Qs=[], score=0, wrong=0, done=0, answered=[];

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

function startQuiz(){
  // Sualları qarışdır, hər sualın variantlarını da qarışdır
  Qs = shuffle(BANK).map(q => ({...q, opts: shuffle([...q.opts])}));
  score=0; wrong=0; done=0;
  answered = Qs.map(()=>false);
  document.getElementById('sc').textContent='0';
  document.getElementById('wc').textContent='0';
  document.getElementById('dc').textContent='0 / '+Qs.length;
  document.getElementById('pf').style.width='0';
  document.getElementById('cfw').innerHTML='';
  renderAll();
}

function renderAll(){
  const area = document.getElementById('qArea');
  area.innerHTML='';
  Qs.forEach((q,i)=> area.appendChild(buildCard(q,i)));
}

function buildCard(q, i){
  const div = document.createElement('div');
  div.className='q-block';
  div.id='qb'+i;

  const typeLabel = q.type==='c'?'Seçim': q.type==='b'?'Bənd seçimi':'Uyğunluq';

  let bodyHtml = '<div class="q-body"><div class="q-text">'+q.q+'</div>';

  if(q.type==='b'){
    bodyHtml += '<ul class="bands">';
    q.bands.forEach(b=> bodyHtml+='<li>'+b+'</li>');
    bodyHtml += '</ul>';
  }

  if(q.type==='m'){
    bodyHtml += '<table class="match-tbl">'
      +'<tr class="mhdr"><td>Rejim</td><td>Misal</td></tr>';
    q.left.forEach(l=> bodyHtml+='<tr><td>'+l+'</td><td>'+q.right[q.left.indexOf(l)]+'</td></tr>');
    bodyHtml += '</table>';
  }

  bodyHtml += '</div>';

  // Options
  const keys=['A','B','C','D','E'];
  let optsHtml='<div class="opts" id="opts'+i+'">';
  q.opts.forEach((opt,oi)=>{
    optsHtml+='<button class="opt" data-q="'+i+'" data-correct="'+opt.c+'" onclick="pickAns('+i+',this)">'
      +'<span class="okey">'+keys[oi]+'</span>'+opt.t+'</button>';
  });
  optsHtml+='</div>';

  div.innerHTML = '<div class="q-header">'
    +'<div class="q-num">SUAL <b>'+(i+1)+'</b> / '+Qs.length+'</div>'
    +'<div class="q-type">'+typeLabel+'</div>'
    +'</div>'
    + bodyHtml
    + optsHtml
    +'<div class="fb" id="fb'+i+'"></div>';

  return div;
}

function pickAns(i, btn){
  if(answered[i]) return;
  answered[i]=true;

  const isOk = btn.dataset.correct==='true';
  const optsDiv = document.getElementById('opts'+i);

  optsDiv.querySelectorAll('.opt').forEach(b=>{
    b.setAttribute('disabled','');
    if(b===btn) b.classList.add(isOk?'correct':'wrong');
    else if(b.dataset.correct==='true') b.classList.add('show-ans');
  });

  const fb = document.getElementById('fb'+i);
  fb.className='fb show '+(isOk?'ok':'fail');
  fb.innerHTML=(isOk?'✅ <b>Düzgün!</b> ':'❌ <b>Səhv.</b> ')+Qs[i].explain;

  if(isOk) score++; else wrong++;
  done++;

  document.getElementById('sc').textContent=score;
  document.getElementById('wc').textContent=wrong;
  document.getElementById('dc').textContent=done+' / '+Qs.length;
  document.getElementById('pf').style.width=(done/Qs.length*100)+'%';

  if(done===Qs.length && Math.round(score/Qs.length*100)>=60) confetti();
}

function confetti(){
  const w=document.getElementById('cfw'); w.innerHTML='';
  const cols=['#0f766e','#166534','#1d4ed8','#92400e','#991b1b'];
  for(let i=0;i<90;i++){
    const p=document.createElement('div'); p.className='cp';
    const s=4+Math.random()*7;
    p.style.cssText='left:'+Math.random()*100+'%;background:'+cols[i%cols.length]
      +';width:'+s+'px;height:'+s+'px;border-radius:'+(Math.random()>.5?'50%':'3px')
      +';animation-duration:'+(1.8+Math.random()*2.4)+'s;animation-delay:'+(Math.random()*1.4)+'s';
    w.appendChild(p);
  }
  setTimeout(()=>w.innerHTML='',6500);
}

startQuiz();
</script>
</body>
</html>
